<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Smart Student Work</title>
  <script>
    // ----------------------------------------------------------------------
    // Single Page Apps for GitHub Pages
    // MIT License - https://github.com/rafgraph/spa-github-pages
    // ----------------------------------------------------------------------
    // Converts the current path and query string into a query string for index.html,
    // e.g. https://kongirr12.github.io/stdw/home -> https://kongirr12.github.io/stdw/?/home
    (function () {
      var l = window.location;
      var pathSegmentsToKeep = l.pathname.startsWith('/stdw') ? 1 : 0;
      var pathParts = l.pathname.split('/');
      var basePath = pathParts.slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' + subPath + search + l.hash;
      l.replace(redirectUrl);
    })();
  </script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;color:#64748b;">
  <p>กำลังเปิดหน้าเว็บ...</p>
  <noscript>
    <p>จาวาสคริปต์ถูกปิดการใช้งาน กรุณา <a href="/stdw/">คลิกที่นี่เพื่อกลับหน้าหลัก</a></p>
  </noscript>
</body>
</html>
